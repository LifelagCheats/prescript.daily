name: Detect Duplicate PRs

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  duplicate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const current = context.payload.pull_request.title;
            const duplicate = pulls.data.find(pr => 
              pr.number !== context.payload.pull_request.number && 
              pr.title === current
            );
            if (duplicate) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['duplicate']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `This PR appears to be a duplicate of #${duplicate.number}. Please close this one and continue discussion there.`
              });
            }

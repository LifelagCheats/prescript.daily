name: Stale Issues

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-stale-issues:
    name: Check Stale Issues
    runs-on: ubuntu-latest

    steps:
      - name: Close Stale Issues
        uses: actions/stale@v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been marked stale due to inactivity.
            Comment here to keep it open.

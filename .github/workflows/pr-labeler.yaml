name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  labeler:
    name: Label Pull Request
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Labeler
        uses: actions/labeler@v6.2.0
        with:
          configuration-path: .github/labeler.yaml

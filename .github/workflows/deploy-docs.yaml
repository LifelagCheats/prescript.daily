name: Deploy Docuemntation to Github Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Typedoc
        run: pnpm run typedoc:html

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Merge Outputs
        run: |
          mkdir -p dist/typedoc
          mkdir -p dist/storybook
          cp -r apps/frontend/docs/html/. dist/typedoc/
          cp -r apps/frontend/docs/storybook/. dist/storybook/
          cp -r apps/frontend/templates/index.html dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
